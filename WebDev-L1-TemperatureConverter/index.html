<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Converter</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="converter-card">

            <div class="header">
                <div class="temperature-icon">°</div>
                <h1>Temperature Converter</h1>
                <p>Convert temperatures between Celsius, Fahrenheit, and Kelvin.</p>
            </div>

            <div class="input-section">

                <label for="temperature">Enter temperature</label>

                <div class="input-row">
                    <input
                        type="number"
                        id="temperature"
                        placeholder="Enter a value"
                        step="any"
                    >

                    <select id="unit">
                        <option value="celsius">Celsius (°C)</option>
                        <option value="fahrenheit">Fahrenheit (°F)</option>
                        <option value="kelvin">Kelvin (K)</option>
                    </select>
                </div>

                <p id="error-message" class="error-message"></p>

                <button id="convert-btn">Convert Temperature</button>

            </div>

            <div class="results">

                <h2>Conversion Results</h2>

                <div class="result-grid">

                    <div class="result-box">
                        <span class="unit-name">Celsius</span>
                        <strong id="celsius-result">--</strong>
                        <span>°C</span>
                    </div>

                    <div class="result-box">
                        <span class="unit-name">Fahrenheit</span>
                        <strong id="fahrenheit-result">--</strong>
                        <span>°F</span>
                    </div>

                    <div class="result-box">
                        <span class="unit-name">Kelvin</span>
                        <strong id="kelvin-result">--</strong>
                        <span>K</span>
                    </div>

                </div>

            </div>

            <div class="info">
                <p>Absolute zero: −273.15°C / −459.67°F / 0 K</p>
            </div>

        </div>

        <footer>
            <p>Temperature Converter • Built with HTML, CSS & JavaScript</p>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
